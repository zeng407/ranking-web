openapi: 3.1.0
info:
  title: 2pick migration API
  version: 0.1.0
  description: >-
    Contract shared by the Laravel identity bridge and the versioned Go API.
    Existing /api routes remain owned by Laravel until their individual cutover.
servers:
  - url: https://2pick.app
  - url: http://localhost
tags:
  - name: Laravel auth bridge
  - name: Go system
  - name: Go auth
  - name: Go public content
  - name: Go gameplay
  - name: Go comments
paths:
  /session-context:
    get:
      operationId: getSessionContext
      tags: [Laravel auth bridge]
      summary: Resolve the current Laravel session and optionally issue a Go API token
      parameters:
        - in: query
          name: locale
          schema:
            type: string
            enum: [zh_TW, en, ja]
      responses:
        "200":
          description: Private session context; this response must never be cached
          headers:
            Cache-Control:
              schema:
                type: string
              example: private, no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionContext"
  /login:
    get:
      operationId: getLoginPage
      tags: [Laravel auth bridge]
      summary: Login page, rendered by the SPA rather than Laravel
      description: >-
        GET is served by the frontend, which renders its own login and
        registration page. Only the POST below reaches Laravel, so this path is
        routed by method at the edge.
      responses:
        "200":
          description: SPA document
          content:
            text/html:
              schema:
                type: string
    post:
      operationId: submitLogin
      tags: [Laravel auth bridge]
      summary: Authenticate against the Laravel session
      description: >-
        Requires the CSRF token from /session-context in X-CSRF-TOKEN, and
        X-Requested-With so Laravel answers with JSON instead of a redirect.
        Laravel regenerates the session on success, invalidating the token the
        caller used.
      parameters:
        - $ref: "#/components/parameters/RequestedWith"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, maxLength: 50 }
                password: { type: string }
                remember: { type: boolean, default: false }
      responses:
        "204":
          description: Session established; no body
        "422":
          $ref: "#/components/responses/ValidationErrorResponse"
        "419":
          description: CSRF token expired; refresh /session-context and retry
  /register:
    post:
      operationId: submitRegistration
      tags: [Laravel auth bridge]
      summary: Create an account and start a Laravel session
      parameters:
        - $ref: "#/components/parameters/RequestedWith"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, password_confirmation]
              properties:
                name: { type: string, maxLength: 20 }
                email: { type: string, format: email, maxLength: 50 }
                password: { type: string, minLength: 8 }
                password_confirmation: { type: string, minLength: 8 }
      responses:
        "201":
          description: Account created and signed in
        "204":
          description: Account created and signed in; no body
        "422":
          $ref: "#/components/responses/ValidationErrorResponse"
  /logout:
    post:
      operationId: submitLogout
      tags: [Laravel auth bridge]
      summary: Invalidate the Laravel session
      parameters:
        - $ref: "#/components/parameters/RequestedWith"
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Session invalidated; no body
        "419":
          description: CSRF token expired; refresh /session-context and retry
  /password/reset:
    get:
      operationId: getPasswordResetPage
      tags: [Laravel auth bridge]
      summary: Password reset request form, still rendered by Laravel
      responses:
        "200":
          description: Blade document
          content:
            text/html:
              schema:
                type: string
  /auth/google/redirect:
    get:
      operationId: redirectToGoogle
      tags: [Laravel auth bridge]
      summary: Begin the Google OAuth handshake
      description: >-
        A full page navigation, not a fetch. Must be same-origin with the SPA so
        the session created by the callback is visible to it.
      responses:
        "302":
          description: Redirect to Google's consent screen
  /health/live:
    get:
      operationId: getLiveness
      tags: [Go system]
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusEnvelope"
  /health/ready:
    get:
      operationId: getReadiness
      tags: [Go system]
      responses:
        "200":
          description: Process is ready to receive traffic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusEnvelope"
        "503":
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/system/info:
    get:
      operationId: getSystemInfo
      tags: [Go system]
      responses:
        "200":
          description: Versioned public Go API information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemInfoEnvelope"
  /api/v1/auth/me:
    get:
      operationId: getGoIdentity
      tags: [Go auth]
      summary: Verify a token and return its identity, with the account behind it
      description: >
        The `user` object replaces the `user` half of Laravel's /session-context, which is
        what the SPA read to draw its own account. Present whenever this process can reach
        the database; without one the endpoint stays a pure token check. has_password and
        linked_google drive the profile page: 82% of accounts have no password, and
        offering them "change password" instead of "set a password" is the difference
        between a working form and one that can never succeed.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The token's claims, plus the account they name when available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityEnvelope"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/auth/login:
    post:
      operationId: goLogin
      tags: [Go auth]
      summary: Exchange an address and password for a session
      description: >
        The access token is in the body; the refresh token is NOT — it is set as an
        httpOnly cookie so script cannot read it, and the CSRF value the client must
        echo back is set as a readable cookie alongside it. Every failure answers 401
        with the same code, deliberately: distinguishing an unknown address from a wrong
        password turns this into an account enumeration oracle.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, maxLength: 255 }
                password: { type: string, maxLength: 72 }
      responses:
        "200":
          description: A new session. Sets the 2pick_refresh and 2pick_csrf cookies.
          headers:
            Set-Cookie:
              description: 2pick_refresh (httpOnly) and 2pick_csrf (readable)
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrantEnvelope"
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "503": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/auth/register:
    post:
      operationId: goRegister
      tags: [Go auth]
      summary: Create a password account and sign it in
      description: >
        Moved off Laravel because it needed no mail: the User model does not implement
        MustVerifyEmail, so registration was only ever a validator, an insert and a
        login. Signing in on success matches what the RegistersUsers trait did.

        A refused sign-up answers 422 with per-field machine codes in `data.errors`
        (required, too_long, too_short, invalid_email, taken, mismatch) rather than with
        sentences: this API has no message catalogue and the client serves three
        languages.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, password_confirmation]
              properties:
                name: { type: string, maxLength: 20, description: Counted in runes, not bytes }
                email: { type: string, maxLength: 50 }
                password: { type: string, minLength: 8, maxLength: 72 }
                password_confirmation: { type: string }
      responses:
        "200":
          description: The account was created and is signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrantEnvelope"
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "422":
          description: Per-field validation codes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FieldErrorsEnvelope"
        "503": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/auth/refresh:
    post:
      operationId: goRefreshSession
      tags: [Go auth]
      summary: Rotate the session
      description: >
        Reads the refresh token from the 2pick_refresh cookie and requires the CSRF value
        in X-CSRF-Token. The presented token is consumed and a new one issued in the same
        family; presenting a token that was already consumed revokes the whole family,
        because there is no way to tell the attacker's copy from the victim's.
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      responses:
        "200":
          description: A rotated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrantEnvelope"
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "503": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/auth/logout:
    post:
      operationId: goLogout
      tags: [Go auth]
      summary: Revoke the session family
      description: >
        Requires X-CSRF-Token when a session cookie is present. Succeeds even when the
        token is already unknown to the server, so a client can always escape a broken
        session.
      parameters:
        - in: header
          name: X-CSRF-Token
          schema: { type: string }
      responses:
        "204": { description: The session is gone and the cookies are cleared }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "503": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/auth/oauth/google/start:
    get:
      operationId: startGoogleSignIn
      tags: [Go auth]
      summary: Redirect the browser to Google
      description: >
        A 302, because the browser navigates here directly. return_to is checked against
        the allowed origins when the flow starts and remembered server-side; a target
        outside the list is replaced with the default rather than refused.
      parameters:
        - in: query
          name: return_to
          schema: { type: string }
      responses:
        "302": { description: Redirect to Google's consent screen }
        "500": { $ref: "#/components/responses/ErrorResponse" }
        "503": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/auth/oauth/google/callback:
    get:
      operationId: completeGoogleSignIn
      tags: [Go auth]
      summary: Finish the Google flow
      description: >
        EVERY outcome is a 302, including the failures: this is reached by a top-level
        navigation, so the caller is looking at a page rather than at a JSON body. The
        result is reported as ?auth=signed-in|registered|linked|failed, with ?reason= on
        a failure. No token ever appears in the redirect URL — the session arrives as
        cookies on this response, and the client calls /api/v1/auth/refresh to obtain an
        access token.
      parameters:
        - { in: query, name: state, schema: { type: string } }
        - { in: query, name: code, schema: { type: string } }
        - { in: query, name: error, schema: { type: string } }
      responses:
        "302":
          description: Redirect back to the SPA, with the session cookies on success
          headers:
            Set-Cookie:
              description: Set on a login, cleared on a failure, absent on a link
              schema: { type: string }
        "503": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/auth/oauth/google/connect:
    post:
      operationId: connectGoogleAccount
      tags: [Go auth]
      summary: Start linking a Google account to the caller's account
      description: >
        Answers with a URL instead of redirecting, and is POST rather than GET, because
        linking has to know who is asking — which needs an Authorization header, and a
        browser cannot put one on a top-level navigation. The client reads the URL and
        navigates itself.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: return_to
          schema: { type: string }
      responses:
        "200":
          description: The URL to navigate to
          content:
            application/json:
              schema:
                type: object
                properties:
                  authorization_url: { type: string }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "500": { $ref: "#/components/responses/ErrorResponse" }
        "503": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/posts:
    get:
      operationId: listPublicPosts
      tags: [Go public content]
      parameters:
        - { in: query, name: sort_by, schema: { type: string, enum: [hot, new], default: hot } }
        - { in: query, name: range, schema: { type: string, enum: [all, year, month, week, day], default: week } }
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: per_page, schema: { type: integer, minimum: 1, maximum: 15, default: 15 } }
        - { in: query, name: k, schema: { type: string, maxLength: 255 } }
      responses:
        "200":
          description: Paginated public voting cards
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostsEnvelope"
        "422": { $ref: "#/components/responses/ErrorResponse" }
        "503": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/account/profile:
    get:
      operationId: goAccountProfile
      tags: [Go account]
      summary: The settings view of the signed-in account
      description: >
        Wider than /api/v1/auth/me, which is drawn on every page and deliberately carries
        no address. This is read by one page the account holder opened on purpose.

        has_password is false for the 11,040 production accounts that signed in through
        Google and hold an empty password column; it decides which of the two verbs on
        /api/v1/account/password the form uses.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountEnvelope"
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "503": { $ref: "#/components/responses/ErrorResponse" }
    put:
      operationId: goChangeAccountName
      tags: [Go account]
      summary: Rename the account
      description: >
        At most one change per calendar day in Asia/Taipei, from
        config/setting.php's name_change_duration. The limit is enforced in the UPDATE's
        WHERE clause rather than by reading the row first, so two simultaneous requests
        cannot both pass it; a refusal is 422 with the code name_change_too_soon.

        Submitting the name the account already has is a success that writes nothing,
        which is what the original did — the settings form posts the field whether or not
        it changed.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  maxLength: 20
                  description: Counted in runes, not bytes. Trimmed before validation.
      responses:
        "200":
          description: The account as it now stands
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountEnvelope"
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "422":
          description: "Per-field codes: required, too_long, name_change_too_soon"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FieldErrorsEnvelope"
        "503": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/account/avatar:
    post:
      operationId: goUploadAccountAvatar
      tags: [Go account]
      summary: Replace the account's avatar
      description: >
        One multipart part named avatar, at most 4 MiB, and PNG, JPEG, GIF or WebP as
        determined from the leading bytes — never from the request's Content-Type, which
        the uploader chooses.

        Laravel declared both of those rules and ran neither: the validator was attached
        to a field named avatar_url while the file arrived as avatar, so `sometimes`
        skipped it and any file of any type was stored and served back under an image URL.

        The previous object is left in the bucket, as the original left it.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [avatar]
              properties:
                avatar:
                  type: string
                  format: binary
      responses:
        "200":
          description: The stored URL
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [avatar_url]
                    properties:
                      avatar_url: { type: string, format: uri }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "422":
          description: "Per-field codes: required, too_large, unsupported_image"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FieldErrorsEnvelope"
        "503": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/account/password:
    put:
      operationId: goChangeAccountPassword
      tags: [Go account]
      summary: Replace the password, proving the current one
      description: >
        EVERY OTHER SESSION ENDS. The reason to change a password is that the old one may
        be known to someone else, and a refresh token issued while it was is what that
        someone would still be holding. The response carries a fresh grant and new session
        cookies, so the caller is not signed out of the page they are on.

        There is no password_confirmation: a typo check belongs in the form, and this API
        has no message catalogue to explain a mismatch in three languages.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string }
                new_password: { type: string, minLength: 8, maxLength: 72 }
      responses:
        "200":
          description: The password was changed and a new session issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrantEnvelope"
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "422":
          description: >
            Per-field codes: required, too_short, too_long on new_password; incorrect or
            no_password_set on current_password.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FieldErrorsEnvelope"
        "503": { $ref: "#/components/responses/ErrorResponse" }
    post:
      operationId: goSetInitialAccountPassword
      tags: [Go account]
      summary: Give an account with no password its first one
      description: >
        For the 11,040 accounts whose password column is empty because they signed in
        through Google. Refused with password_already_set when one is set: that case has
        to prove the current password, or a stolen access token would be enough to take
        the account over.

        Unlike PUT, this revokes nothing. There was no password to have leaked, so
        signing the account out of its other devices would cost the holder something and
        buy nothing.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_password]
              properties:
                new_password: { type: string, minLength: 8, maxLength: 72 }
      responses:
        "200":
          description: The password was set and a new session issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrantEnvelope"
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "422":
          description: "Per-field codes: required, too_short, too_long, password_already_set"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FieldErrorsEnvelope"
        "503": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/account/posts:
    get:
      operationId: goListMyPosts
      tags: [Go editor]
      summary: The caller's own posts
      description: >
        Ownership is part of every statement in this group rather than a check before it,
        so a serial that is not the caller's does not resolve at all. That is also why a
        stranger's post answers 404 and never 403: a 403 would confirm the serial exists.
      security:
        - bearerAuth: []
      parameters:
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
      responses:
        "200":
          description: One page of posts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyPostListEnvelope"
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "503": { $ref: "#/components/responses/ErrorResponse" }
    post:
      operationId: goCreatePost
      tags: [Go editor]
      summary: Create a post
      description: >
        A password post must carry its password here: there is no stored one to fall back
        on. The password is hashed with SHA-256, not bcrypt, because that is what the
        column holds and the game and rank pages still compare against it through Laravel.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostDraft"
      responses:
        "201":
          description: The post was created
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [serial]
                    properties:
                      serial: { type: string, minLength: 8, maxLength: 8 }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "422":
          description: "Per-field codes: required, too_long, invalid_policy, too_many"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FieldErrorsEnvelope"
        "503": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/account/posts/{serial}:
    parameters:
      - { in: path, name: serial, required: true, schema: { type: string, minLength: 8, maxLength: 8 } }
    get:
      operationId: goShowMyPost
      tags: [Go editor]
      summary: One of the caller's posts
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyPostEnvelope"
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "503": { $ref: "#/components/responses/ErrorResponse" }
    put:
      operationId: goUpdatePost
      tags: [Go editor]
      summary: Rewrite a post's metadata, policy and tags
      description: >
        THE PASSWORD RULES ARE THE ORIGINAL'S. A post that stays password-protected keeps
        its stored password when none is sent, so editing a title does not silently open
        the door; a post that leaves the password policy has its password erased, so
        switching back later cannot revive one the author has forgotten. Turning a post
        into a password post with nothing stored and nothing sent is refused.

        `tags` absent leaves the tags alone; `tags: []` clears them.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostDraft"
      responses:
        "200":
          description: The post as it now stands
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyPostEnvelope"
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FieldErrorsEnvelope"
          description: Per-field codes
        "503": { $ref: "#/components/responses/ErrorResponse" }
    delete:
      operationId: goDeletePost
      tags: [Go editor]
      summary: Delete a post, its elements and its rank reports
      description: >
        Soft-deletes the post and its elements, detaches its tags and removes its rank
        reports, in one transaction — the original did those as three separate effects
        that could half-apply. The rebuild of the rank report is queued afterwards.

        The account password confirms the deletion, IN THE BODY rather than the query
        string, which would reach the access log and the browser's history. It is required
        only when the account has a password: the original ran password_verify against a
        column that is an empty string for the 11,040 accounts created through Google, and
        an empty hash never verifies, so none of them could ever delete a post.
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                  description: Required when the account has a password.
      responses:
        "204": { description: Deleted }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "422":
          description: "Per-field codes on password: required, incorrect"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FieldErrorsEnvelope"
        "503": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/account/posts/{serial}/elements:
    get:
      operationId: goListPostElements
      tags: [Go editor]
      summary: One page of a post's elements
      description: >
        `page` and `per_page` are independent, which the original's were not: it read the
        page number out of the per_page key, so asking for 50 per page asked for page 50
        and a caller who sent per_page could never see the first page.

        Each element carries its rank IN THIS POST. An element can belong to several
        posts and its rank is per post, so reading it by element alone would show a
        standing from somewhere else.
      security:
        - bearerAuth: []
      parameters:
        - { in: path, name: serial, required: true, schema: { type: string } }
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: per_page, schema: { type: integer, minimum: 1, maximum: 100, default: 100 } }
        - in: query
          name: title
          description: Substring match. Wildcards in the term are matched as text.
          schema: { type: string }
        - { in: query, name: sort_by, schema: { type: string, enum: [id, title], default: id } }
        - { in: query, name: sort_dir, schema: { type: string, enum: [asc, desc], default: desc } }
      responses:
        "200":
          description: One page of elements
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostElementListEnvelope"
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "503": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/account/posts/{serial}/elements/uploads:
    post:
      operationId: goUploadPostElement
      tags: [Go editor]
      summary: Add an uploaded image or video to a post
      description: >
        One multipart part named file, at most 4 MiB, and PNG, JPEG, GIF, BMP, WebP, AVI,
        MP4 or MPEG — the set Laravel's mimetypes rule allowed, no wider.

        THE TYPE AND THE STORED EXTENSION BOTH COME FROM THE BYTES. A file called
        holiday.png that is really a video is stored under a .mp4 key with a video content
        type and written as a video element; taking the extension from the name would
        leave the browser refusing to play it and the thumbnail job trying to read it as a
        picture.

        A video queues its thumbnail immediately, which is what MakeVideoThumbnail did on
        VideoElementCreated. An image does not: ImageElementCreated had no listeners, and
        the make-thumbnails schedule sweeps images up.

        Uploads are budgeted per account at 30 MiB or 50 files a minute. A refused
        request — wrong type, too large, post full — does not spend any of it.
      security:
        - bearerAuth: []
      parameters:
        - { in: path, name: serial, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "201":
          description: The element was added
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [id, source_url, thumb_url, title, type]
                    properties:
                      id: { type: integer, format: int64 }
                      source_url: { type: string }
                      thumb_url: { type: string }
                      title: { type: string }
                      type: { type: string, enum: [image, video] }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "422":
          description: >
            Per-field codes on file: required, too_large, unsupported_media, post_full,
            rate_limited.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FieldErrorsEnvelope"
        "503": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/account/posts/{serial}/elements/urls:
    post:
      operationId: goAddPostElementsByURL
      tags: [Go editor]
      summary: Add media to a post from a list of URLs
      description: >
        The list is the original's format: comma-separated, each entry optionally
        "url title" split on the first space. A YouTube embed is the WHOLE field rather
        than one entry — it is a block of HTML full of spaces, so the splitter would tear
        it apart, and the original checked the entire input for one before splitting.

        Recognised without touching the network: YouTube (watch, youtu.be, shorts, embed,
        music. and any other *.youtube.com host), Bilibili, Twitch, and any URL ending
        .jpg, .png or .gif. Anything else is settled with one HEAD, which reports both the
        type and the size — so a link that is too large is refused without downloading it.

        Images and Bilibili previews are copied into this site's storage; the bytes are
        sniffed after the download, because a URL that answered image/png to the HEAD can
        serve anything at all to the GET. A direct video file is linked rather than copied,
        which is what the 2,205 rows with video_source=url hold.

        Twitch is recognised and reported unavailable: 42 elements a year and no
        credentials in this deployment. Imgur is not recognised at all — 0 rows, removed
        from the project.
      security:
        - bearerAuth: []
      parameters:
        - { in: path, name: serial, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [urls]
              properties:
                urls:
                  type: string
                  description: >
                    Comma-separated, each entry optionally "url title". At most 100 URLs.
      responses:
        "201":
          description: Every URL became an element
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddedElementsEnvelope"
        "207":
          description: >
            Some URLs became elements and some did not, which is the ordinary outcome of a
            pasted list. `failed` names each one and why: unrecognised, unavailable,
            too_large or post_full.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddedElementsEnvelope"
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "422":
          description: "Per-field codes on urls: required, too_many"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FieldErrorsEnvelope"
        "503": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/account/elements/{elementID}:
    parameters:
      - { in: path, name: elementID, required: true, schema: { type: integer, format: int64 } }
    put:
      operationId: goUpdateElement
      tags: [Go editor]
      summary: Rename an element or move a video's trim points
      description: >
        Every field is optional and an absent one is left alone, which is what makes a
        sent zero different from an omission. A trim whose end is at or before its start
        is refused: the original stored it and the player then showed an element nobody
        could see.

        Replacing an element's media is not here — that is the ingestion path, which is
        still Laravel's.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, maxLength: 100 }
                video_start_second: { type: integer, minimum: 0 }
                video_end_second: { type: integer, minimum: 0 }
      responses:
        "200":
          description: The element as it now stands
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostElementEnvelope"
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "422":
          description: "Per-field codes: too_long, invalid_range"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FieldErrorsEnvelope"
        "503": { $ref: "#/components/responses/ErrorResponse" }
    delete:
      operationId: goDeleteElement
      tags: [Go editor]
      summary: Remove an element from its posts
      description: >
        Detaches it from every post, soft-deletes it and removes its rank reports, then
        queues a rebuild for each post it was ranked in — an element can belong to more
        than one.
      security:
        - bearerAuth: []
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "503": { $ref: "#/components/responses/ErrorResponse" }
