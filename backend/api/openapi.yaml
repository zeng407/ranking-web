          application/json:
            schema:
              type: object
              required: [post_serial, element_count]
              properties:
                post_serial: { type: string, maxLength: 255 }
                element_count: { type: integer, minimum: 2, maximum: 1024 }
      responses:
        "201":
          description: Newly created game and its randomly selected elements
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameSessionEnvelope"
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
        "503": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/games/{serial}/votes/batch:
    post:
      operationId: submitPublicGameVotes
      tags: [Go gameplay]
      parameters:
        - { in: path, name: serial, required: true, schema: { type: string, maxLength: 255 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_vote_count, votes]
              properties:
                expected_vote_count: { type: integer, minimum: 0 }
                anonymous_id: { type: string, maxLength: 128 }
                votes:
                  type: array
                  minItems: 1
                  maxItems: 128
                  items: { $ref: "#/components/schemas/GameVote" }
                current_candidates:
                  description: >
                    The pair the client is displaying AFTER these votes, sent only while
                    hosting a game room.

                    games.candidates means "the pair on screen". In Laravel the server knew
                    it, because the host's client asked for each next pair; the Go client
                    plays its bracket locally and batch-submits, so it has to say. Without
                    this the column ends up holding the pair just ELIMINATED and the room
                    shows its participants a match that is already decided.

                    Ignored unless it names two elements of the game that are still in play:
                    the votes in the same request are valid regardless, and losing real
                    progress over a display hint would be worse.
                  type: array
                  minItems: 2
                  maxItems: 2
                  items: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Accepted revision and completion state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchVoteEnvelope"
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
        "503": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/games/{serial}/elements:
    get:
      operationId: resumePublicGame
      tags: [Go gameplay]
      parameters:
        - { in: path, name: serial, required: true, schema: { type: string, maxLength: 255 } }
      responses:
        "200":
          description: Full selected candidate list used to hydrate an interrupted local snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameSessionEnvelope"
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
        "503": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/games/{serial}/result:
    get:
      operationId: getGameResult
      tags: [Go gameplay]
      summary: The finished game's standings
      description: >
        Answered privately rather than cached: a game serial is a share capability, so a
        shared result must not land in a broader CDN cache key, and global_rank moves as
        other people play.
      parameters:
        - { in: path, name: serial, required: true, schema: { type: string, maxLength: 255 } }
      responses:
        "200":
          description: The per-element standings for one completed game
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameResultEnvelope"
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
        "503": { $ref: "#/components/responses/ErrorResponse" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Ed25519 JWT
  parameters:
    RequestedWith:
      in: header
      name: X-Requested-With
      required: true
      description: Must be XMLHttpRequest so Laravel returns JSON, not a redirect.
      schema:
        type: string
        const: XMLHttpRequest
    CsrfToken:
      in: header
      name: X-CSRF-TOKEN
      required: true
      description: The csrf_token most recently returned by /session-context.
      schema:
        type: string
  responses:
    ErrorResponse:
      description: API error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ValidationErrorResponse:
      description: Laravel validation failure
      content:
        application/json:
          schema:
            type: object
            required: [message, errors]
            properties:
              message:
                type: string
              errors:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: string
  schemas:
    FieldErrorsEnvelope:
      type: object
      required: [data, error]
      properties:
        data:
          type: object
          required: [errors]
          properties:
            errors:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
                  enum: [required, too_long, too_short, invalid_email, taken, mismatch]
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, enum: [validation_failed] }
            message: { type: string }
        meta:
          $ref: "#/components/schemas/Meta"
    GameRoomEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [serial, game_serial]
              properties:
                serial: { type: string }
                game_serial: { type: string }
                player:
                  oneOf:
                    - $ref: "#/components/schemas/GameRoomPlayer"
                    - type: "null"
                votes:
                  description: >
                    Null when no pairing is in progress, so a client can tell that apart
                    from "nobody has voted yet".
                  oneOf:
                    - $ref: "#/components/schemas/GameRoomVotes"
                    - type: "null"
                latest_bet:
                  description: The caller's own last wager, for rehydrating a reloaded page.
                  oneOf:
                    - $ref: "#/components/schemas/GameRoomBet"
                    - type: "null"
                leaderboard:
                  oneOf:
                    - $ref: "#/components/schemas/GameRoomLeaderboard"
                    - type: "null"
    GameRoomPlayerEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/GameRoomPlayer" }
    GameRoomLeaderboardEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/GameRoomLeaderboard" }
    AccountEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Account"
    Account:
      type: object
      required: [name, email, avatar_url, has_password, google_linked]
      properties:
        name: { type: string }
        email:
          type: string
          description: >
            Read-only here. The original's settings form had an address field but its
            controller never accepted one, so an address has never been changeable.
        avatar_url:
          type: string
          description: >
            "" when the account has none, which the client replaces with the default
            asset. 11,060 production accounts hold a Google URL rather than one of ours.
        has_password:
          type: boolean
          description: >
            False for an account whose password column is empty. Decides whether the form
            offers PUT (change) or POST (set the first one) on /api/v1/account/password.
        google_linked: { type: boolean }
        name_change_allowed_at:
          type: string
          format: date-time
          description: >
            Absent when the name may be changed now. Present as the moment the limit
            lifts, so a client can say when rather than only that it cannot.
    AddedElementsEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [added, failed]
          properties:
            added:
              type: array
              items:
                type: object
                required: [id, source_url, thumb_url, title, type]
                properties:
                  id: { type: integer, format: int64 }
                  source_url: { type: string }
                  thumb_url: { type: string }
                  title: { type: string }
                  type: { type: string, enum: [image, video] }
            failed:
              type: array
              items:
                type: object
                required: [url, reason]
                properties:
                  url: { type: string }
                  reason:
                    type: string
                    enum: [unrecognised, unavailable, too_large, post_full]
    MyPostListEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [posts, total, page, per_page]
          properties:
            posts:
              type: array
              items: { $ref: "#/components/schemas/MyPost" }
            total: { type: integer }
            page: { type: integer }
            per_page: { type: integer }
    MyPostEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/MyPost"
    MyPost:
      type: object
      required: [serial, title, description, access_policy, has_password, tags, play_count, this_week_play_count, last_week_play_count]
      properties:
        serial: { type: string }
        title: { type: string, maxLength: 50 }
        description: { type: string, maxLength: 300 }
        access_policy: { type: string, enum: [private, public, password] }
        has_password:
          type: boolean
          description: >
            Whether a password is set, never what it is. The Blade editor read the column
            server-side to choose between "set a password" and "change it"; a client
            cannot, and the hash must not leave the server.
        tags:
          type: array
          maxItems: 5
          items: { type: string, maxLength: 15 }
        play_count: { type: integer }
        this_week_play_count: { type: integer }
        last_week_play_count: { type: integer }
        created_at: { type: string, format: date-time }
    PostDraft:
      type: object
      required: [title, description, access_policy]
      properties:
        title: { type: string, maxLength: 50, description: Counted in runes. Trimmed. }
        description: { type: string, maxLength: 300 }
        access_policy: { type: string, enum: [private, public, password] }
        password:
          type: string
          description: >
            The post's door code, not a credential. Required when creating a password
            post; on update, omitting it keeps the stored one.
        tags:
          type: array
          maxItems: 5
          items: { type: string, maxLength: 15 }
          description: Absent leaves the tags alone; an empty list clears them.
    PostElementListEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [elements, total, page, per_page]
          properties:
            elements:
              type: array
              items: { $ref: "#/components/schemas/PostElement" }
            total: { type: integer }
            page: { type: integer }
            per_page: { type: integer }
    PostElementEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/PostElement"
    PostElement:
      type: object
      required: [id, source_url, thumb_url, title, type]
      properties:
        id: { type: integer, format: int64 }
        source_url: { type: string }
        thumb_url: { type: string }
        mediumthumb_url: { type: string }
        lowthumb_url: { type: string }
        title: { type: string, maxLength: 100 }
        type: { type: string, enum: [image, video] }
        video_source: { type: string }
        video_id: { type: string }
        video_duration_second: { type: integer, nullable: true }
        video_start_second: { type: integer, nullable: true }
        video_end_second: { type: integer, nullable: true }
        created_at: { type: string, format: date-time }
        rank:
          nullable: true
          description: The element's standing in THIS post, or null if nobody has voted.
          type: object
          properties:
            rank: { type: integer }
            win_rate: { type: number }
            final_win_rate: { type: number }
    GameRoomLeaderboard:
      description: >
        The same payload the worker broadcasts on the room's Soketi channel, so a client
        can apply a poll result and a live event through one code path.
      type: object
      required: [total_users, top_10, bottom_10]
      properties:
        total_users: { type: integer }
        top_10:
          description: Best first.
          type: array
          items: { $ref: "#/components/schemas/GameRoomBroadcastPlayer" }
        bottom_10:
          description: >
            WORST first. The PHP used orderByDesc('rank')->limit(10), so the array starts
            at last place; reversing it would silently flip the order the UI renders.
          type: array
          items: { $ref: "#/components/schemas/GameRoomBroadcastPlayer" }
    GameRoomBroadcastPlayer:
      description: >
        Carries user_id rather than player_id, because that is the field name
        GameRoomUserResource used and the broadcast payload has to stay byte-compatible
        with what the existing UI reads. The value is the same digest.
      type: object
      required: [user_id, name, score, rank, accuracy, total_played, total_correct, combo]
      properties:
        user_id: { type: string }
        name: { type: string }
        score: { type: integer }
        rank: { type: integer }
        accuracy: { type: string }
        total_played: { type: integer }
        total_correct: { type: integer }
        combo:
          type: integer
          description: >
            The streak the player's next wager will ride on: the number of consecutive
            correct picks ending at their newest settled wager, or 0 if that wager lost.
            Derived from the outcomes, so it does not depend on how quickly the wagers
            were placed or on the order settlements arrived.
    GameRoomPlayer:
      type: object
      required: [player_id, name, score, rank, accuracy, total_played, total_correct, combo]
      properties:
        player_id:
          type: string
          description: A digest of the row id and the browser id, never the row id itself.
        name: { type: string }
        score: { type: integer }
        rank: { type: integer }
        accuracy:
          type: string
          description: >
            A STRING, not a number: the client interpolates it into a percentage label, and
            a float renders as 63.489999999999995.
        total_played: { type: integer }
        total_correct: { type: integer }
        combo:
          type: integer
          description: >
            The streak the player's next wager will ride on: the number of consecutive
            correct picks ending at their newest settled wager, or 0 if that wager lost.
            Derived from the outcomes, so it does not depend on how quickly the wagers
            were placed or on the order settlements arrived.
    GameRoomVotes:
      type: object
      required: [first_candidate, second_candidate, first_candidate_votes, second_candidate_votes, remain_elements, total_votes]
      properties:
        first_candidate: { type: integer }
        second_candidate: { type: integer }
        first_candidate_votes: { type: integer }
        second_candidate_votes: { type: integer }
        remain_elements: { type: integer }
        total_votes: { type: integer }
    GameRoomBet:
      type: object
      required: [winner_id, loser_id, current_round, of_round, remain_elements]
      properties:
        winner_id: { type: integer }
        loser_id: { type: integer }
        current_round: { type: integer }
        of_round: { type: integer }
        remain_elements: { type: integer }
    GrantEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Grant"
        meta:
          $ref: "#/components/schemas/Meta"
    Grant:
      type: object
      required: [access_token, token_type, expires_in, csrf_token, user_id, roles]
      properties:
        access_token:
          type: string
          description: The Ed25519 at+jwt. Short-lived, so script is allowed to hold it.
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          description: Seconds. Between 60 and 900; 300 by default.
        csrf_token:
          type: string
          description: >
            Also set as the readable 2pick_csrf cookie. Must be echoed in X-CSRF-Token on
            refresh and logout. The refresh token itself is never in this body.
        user_id:
          type: string
        roles:
          type: array
          items: { type: string }
    SessionContext:
      type: object
      required: [authenticated, csrf_token, locale, api_token, user]
      properties:
        authenticated:
          type: boolean
        csrf_token:
          type: string
        locale:
          type: string
          enum: [zh_TW, en, ja]
        api_token:
          oneOf:
            - $ref: "#/components/schemas/ApiToken"
            - type: "null"
        user:
          oneOf:
            - $ref: "#/components/schemas/NavbarUser"
            - type: "null"
    ApiToken:
      type: object
      required: [access_token, token_type, expires_in, expires_at]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          const: Bearer
        expires_in:
          type: integer
          minimum: 60
          maximum: 900
        expires_at:
          type: integer
          description: Unix timestamp
    NavbarUser:
      type: object
      required: [avatar_url]
      properties:
        avatar_url:
          type: [string, "null"]
          format: uri
    StatusEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  const: ok
    SystemInfoEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [service, version, commit, environment, time]
              properties:
                service: { type: string }
                version: { type: string }
                commit: { type: string }
                environment: { type: string }
                time: { type: string, format: date-time }
    IdentityEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [subject, roles, expires_at]
              properties:
                subject:
                  type: string
                roles:
                  type: array
                  items: { type: string }
                expires_at:
                  type: string
                  format: date-time
                user:
                  description: >
                    Absent when this process cannot reach the database. Replaces the
                    `user` half of Laravel's /session-context.
                  type: object
                  required: [user_id, name, avatar_url, has_password, linked_google]
                  properties:
                    user_id: { type: string }
                    name: { type: string }
                    avatar_url: { type: [string, "null"] }
                    has_password:
                      type: boolean
                      description: False for the 82% of accounts that signed up through Google.
                    linked_google: { type: boolean }
    PostElement:
      type: object
      required: [id, url, url2, title, type, video_source, previewable]
      properties:
        id: { type: [integer, "null"] }
        url: { type: [string, "null"], format: uri }
        url2: { type: [string, "null"], format: uri }
        title: { type: [string, "null"] }
        type: { type: [string, "null"] }
        video_source: { type: [string, "null"] }
        previewable: { type: boolean }
    PublicPost:
      type: object
      required: [title, serial, is_private, description, element1, element2, created_at, updated_at, play_count, elements_count, tags, is_censored]
      properties:
        title: { type: string }
        serial: { type: string }
        is_private: { type: boolean }
        description: { type: string }
        element1: { $ref: "#/components/schemas/PostElement" }
        element2: { $ref: "#/components/schemas/PostElement" }
        created_at: { type: string }
        updated_at: { type: string }
        play_count: { type: integer }
        elements_count: { type: integer }
        tags:
          type: array
          items: { type: string }
        is_censored: { type: integer }
    PostsEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [items, group, page, per_page, total, total_pages]
              properties:
                items: { type: array, items: { $ref: "#/components/schemas/PublicPost" } }
                page: { type: integer }
                per_page: { type: integer }
                total: { type: integer }
                total_pages: { type: integer }
    TagsEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: array
              items:
                type: object
                required: [name, count]
                properties:
                  name: { type: string }
                  count: { type: integer }
    HotTagsEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: object
              additionalProperties: { type: integer }
    CarouselEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: array
              items: { type: object, additionalProperties: true }
    ChampionsEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: array
              items: { type: object, additionalProperties: true }
    RankReport:
      type: object
      required: [rank, win_rate, date, element]
      properties:
        rank: { type: [integer, "null"] }
        win_rate: { type: string }
        date: { type: string, format: date }
        element: { type: object, additionalProperties: true }
    RankSearchEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/RankReport" }
    RanksPageEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [items, page, per_page, total, total_pages]
              properties:
                items:
                  type: array
                  items: { $ref: "#/components/schemas/RankReport" }
                group: { type: string, enum: [cumulative, recent_1000] }
                page: { type: integer }
                per_page: { type: integer }
                total: { type: integer }
                total_pages: { type: integer }
    RankDetailsEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [current, groups, history]
              properties:
                current:
                  oneOf:
                    - $ref: "#/components/schemas/RankReport"
                    - type: "null"
                groups:
                  type: object
                  required: [cumulative, recent_1000]
                  properties:
                    cumulative:
                      oneOf:
                        - $ref: "#/components/schemas/RankReport"
                        - type: "null"
                    recent_1000:
                      oneOf:
                        - $ref: "#/components/schemas/RankReport"
                        - type: "null"
                history:
                  type: object
                  additionalProperties:
                    type: array
                    items: { type: object, additionalProperties: true }
    Comment:
      type: object
      required: [id, content, created_at, edited_at, nickname, avatar_url, champions]
      properties:
        id: { type: integer }
        content: { type: string }
        created_at: { type: string, format: date-time }
        edited_at: { type: [string, "null"], format: date-time }
        nickname: { type: string }
        avatar_url: { type: [string, "null"], format: uri }
        champions: { type: array, items: { type: string } }
    CommentProfile:
      type: object
      required: [nickname, avatar_url, champions, is_auth]
      properties:
        nickname: { type: string }
        avatar_url: { type: [string, "null"], format: uri }
        champions: { type: array, items: { type: string } }
        is_auth: { type: boolean }
    CommentEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/Comment" }
    CommentsPageEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [items, page, per_page, total, total_pages, profile]
              properties:
                items: { type: array, items: { $ref: "#/components/schemas/Comment" } }
                page: { type: integer }
                per_page: { type: integer }
                total: { type: integer }
                total_pages: { type: integer }
                profile: { $ref: "#/components/schemas/CommentProfile" }
    GameDefinition:
      type: object
      required: [title, serial, description, is_censored, elements_count, max_elements, element1, element2]
      properties:
        title: { type: string }
        serial: { type: string }
        description: { type: string }
        is_censored: { type: boolean }
        elements_count: { type: integer }
        max_elements: { type: integer, maximum: 1024 }
        element1:
          description: >-
            Preview option shown before the game starts, so the page can paint
            content on first load. Null when no preview is available.
          oneOf:
            - $ref: "#/components/schemas/PostElement"
            - type: "null"
        element2:
          description: Second preview option; null when unavailable.
          oneOf:
            - $ref: "#/components/schemas/PostElement"
            - type: "null"
    GameElement:
      type: object
      required: [id, title, type]
      properties:
        id: { type: integer }
        title: { type: string }
        type: { type: string }
        source_url: { type: [string, "null"] }
        thumb_url: { type: [string, "null"] }
        mediumthumb_url: { type: [string, "null"] }
        lowthumb_url: { type: [string, "null"] }
        video_start_second: { type: [integer, "null"] }
        video_end_second: { type: [integer, "null"] }
        video_source: { type: [string, "null"] }
        video_id: { type: [string, "null"] }
        video_duration_second: { type: [integer, "null"] }
    GameVote:
      type: object
      required: [winner_id, loser_id]
      properties:
        winner_id: { type: integer, minimum: 1 }
        loser_id: { type: integer, minimum: 1 }
    GameDefinitionEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/GameDefinition" }
    GameResultEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [game_serial, post_serial, items]
              properties:
                game_serial: { type: string }
                post_serial: { type: string }
                items:
                  type: array
                  items:
                    type: object
                    required: [rank, win_count, global_rank, element]
                    properties:
                      rank: { type: integer, minimum: 1 }
                      win_count: { type: integer, minimum: 0 }
                      global_rank:
                        description: >
                          Null until the element has a rank across all games. Nullable
                          rather than zero, so "not ranked yet" is distinguishable from
                          a real position.
                        oneOf:
                          - { type: integer, minimum: 1 }
                          - { type: "null" }
                      element: { $ref: "#/components/schemas/GameElement" }
    GameSessionEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [game_serial, server_vote_count, post, elements]
              properties:
                game_serial: { type: string, format: uuid }
                server_vote_count: { type: integer, minimum: 0 }
                post: { $ref: "#/components/schemas/GameDefinition" }
                elements:
                  type: array
                  items: { $ref: "#/components/schemas/GameElement" }
    BatchVoteEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [status, server_vote_count, complete]
              properties:
                status: { type: string, enum: [processing, end_game] }
                server_vote_count: { type: integer, minimum: 0 }
                complete: { type: boolean }
    SuccessEnvelope:
      type: object
      required: [data, meta]
      properties:
        data: {}
        meta:
          $ref: "#/components/schemas/Meta"
    ErrorEnvelope:
      type: object
      required: [error, meta]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
        meta:
          $ref: "#/components/schemas/Meta"
    Meta:
      type: object
      required: [request_id]
      properties:
        request_id:
          type: string
