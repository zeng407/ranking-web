  /api/v1/game-posts/{serial}:
    get:
      operationId: getPublicGameDefinition
      tags: [Go gameplay]
      parameters:
        - { in: path, name: serial, required: true, schema: { type: string, maxLength: 255 } }
      responses:
        "200":
          description: Public game title, description and selectable element limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameDefinitionEnvelope"
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
        "503": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/game-rooms:
    post:
      operationId: openGameRoom
      tags: [Go gameplay]
      summary: Open the room for a game, or return the one already running
      description: >
        Idempotent, so the host's page may call it on every load. 201 means this call
        opened the room and 200 means it was already open — the only way a host can tell
        the two apart. A unique index on game_rooms.game_id makes a concurrent second call
        return the first call's room; without it, production ended up with two games whose
        second room was unreachable.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [game_serial]
              properties:
                game_serial: { type: string, maxLength: 255 }
                current_candidates:
                  description: >
                    The pair already on screen when the room is opened. Laravel's createRoom
                    took the same parameter: a host opens the room mid-game, and without this
                    the first participants are shown the match that was last decided. Ignored
                    unless it names two elements of that game that are still in play.
                  type: array
                  minItems: 2
                  maxItems: 2
                  items: { type: integer, minimum: 1 }
      responses:
        "200":
          description: The room was already open
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GameRoomEnvelope" }
        "201":
          description: The room was opened by this call
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GameRoomEnvelope" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
        "503": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/game-rooms/{serial}:
    get:
      operationId: getGameRoomState
      tags: [Go gameplay]
      summary: Join a room and read everything needed to draw it
      description: >
        One call in place of Laravel's getRoom, getRoomVotes and getRoomUser: three round
        trips before the page could draw, each able to observe a different moment and each
        racing to create the participant row.

        anonymous_id is REQUIRED. Laravel defaulted it to the literal "unknown", which put
        every visitor without a session onto one participant row — shared score, shared
        wagers. Identity in a room is the browser id; an access token, when present, is
        recorded on the row for audit but never required.
      parameters:
        - { in: path, name: serial, required: true, schema: { type: string, maxLength: 255 } }
        - in: query
          name: anonymous_id
          required: true
          schema: { type: string, maxLength: 255 }
        - in: query
          name: game_serial
          description: Checked when supplied, so a stale link cannot silently join another game's room.
          schema: { type: string, maxLength: 255 }
      responses:
        "200":
          description: The caller's player, the round's votes, their last wager and the standings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GameRoomEnvelope" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
        "503": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/game-rooms/{serial}/leaderboard:
    get:
      operationId: getGameRoomLeaderboard
      tags: [Go gameplay]
      summary: The standings, for clients with no working websocket
      description: >
        The live path is the Soketi broadcast the worker publishes after each settlement.
        This exists so a blocked websocket degrades to a stale-but-moving leaderboard
        rather than a frozen one. It does not join the room, so it needs no anonymous id.
      parameters:
        - { in: path, name: serial, required: true, schema: { type: string, maxLength: 255 } }
      responses:
        "200":
          description: Current standings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GameRoomLeaderboardEnvelope" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "503": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/game-rooms/{serial}/bets:
    post:
      operationId: placeGameRoomBet
      tags: [Go gameplay]
      summary: Wager on the round in progress
      description: >
        Replaces the caller's previous wager on the same round rather than adding one: an
        upsert against the unique index added in migration 00011. Without that index a
        double-clicked vote inserted twice, both copies settled, and the round was counted
        twice — which is what happened to thirteen rounds in production.

        Changing a vote clears its outcome, so the settlement pass decides the new pick
        rather than scoring it with the old result.

        THE ROUND NUMBERS ARE NOT SENT. game_1v1_rounds records COMPLETED matches, so the
        one in progress is a bracket calculation — of_round is fixed when a bracket starts,
        which is why a row can read "30 of 32" with 34 elements left. A participant is
        watching somebody else's game and has none of that state, so the server derives the
        numbers and also checks the pick is the pairing on screen; a stale page would
        otherwise record a wager the settlement could never resolve.

        409 no_round_in_progress when the host has put up nothing yet, and 409 stale_pairing
        when the pairing has moved on. 409 rather than 422 because the request is well
        formed and a retry will work.

        204 because nothing is decided yet: the outcome arrives on the room's channel when
        the host advances the round.
      parameters:
        - { in: path, name: serial, required: true, schema: { type: string, maxLength: 255 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [anonymous_id, winner_id, loser_id]
              properties:
                anonymous_id: { type: string, maxLength: 255 }
                winner_id: { type: integer, minimum: 1 }
                loser_id: { type: integer, minimum: 1 }
      responses:
        "204": { description: The wager is recorded }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
        "503": { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/game-rooms/{serial}/player:
    put:
      operationId: renameGameRoomPlayer
      tags: [Go gameplay]
      summary: Change the caller's display name in a room
      description: >
        Rate limited to one change per thirty seconds, because a rename is broadcast to
        everyone in the room. The name is capped at ten characters counted in RUNES: the
        column is utf8mb4 and these names are mostly Chinese, so a byte limit would reject
        the longest name the old form allowed.
      parameters:
        - { in: path, name: serial, required: true, schema: { type: string, maxLength: 255 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [anonymous_id, nickname]
              properties:
                anonymous_id: { type: string, maxLength: 255 }
                nickname: { type: string, maxLength: 10 }
      responses:
        "200":
          description: The player, with the stored name
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GameRoomPlayerEnvelope" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
        "429": { $ref: "#/components/responses/ErrorResponse" }
        "503": { $ref: "#/components/responses/ErrorResponse" }
