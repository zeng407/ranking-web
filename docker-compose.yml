# Laravel Sail stack — the part that has not migrated yet.
#
# This file is being emptied out over time. Services move to
# compose.separated.yml as the Go stack takes them over, and that file
# `include:`s this one, so BOTH files form a single Compose project named
# `ranking-web`. That matters for two reasons:
#
#   - one `docker compose -f compose.separated.yml up -d` starts everything, so
#     there is no second environment to remember;
#   - the project name prefixes the volume names, so keeping it `ranking-web` is
#     what makes `ranking-web_sail-mysql` (56.6 GB, the restored production dump)
#     keep resolving. Renaming the project would quietly mount an empty volume
#     instead and look like total data loss.
#
# Already moved to compose.separated.yml: redis, minio, selenium, soketi.
#
# Deliberately still here:
#   - mysql / mysql_test — the databases stay put for now.
#   - laravel.test — the `sail` CLI reads this file and expects the service in it,
#     and this container is the thing being retired, so moving it buys nothing.
services:
    laravel.test:
        build:
            context: ./docker/8.2
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: sail-8.2/app
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-80}:80'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        # redis, minio, selenium and soketi now live in compose.separated.yml.
        # They still resolve here because both files are the same project; that
        # is also why this file cannot be brought up on its own any more.
        depends_on:
            - mysql
            - redis
            - minio
            - selenium
            - soketi
    mysql:
        image: 'mysql/mysql-server:8.0'
        ports:
            - '${FORWARD_DB_PORT:-3306}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ALLOW_EMPTY_PASSWORD: 'no'
        volumes:
            - 'sail-mysql:/var/lib/mysql'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - mysqladmin
                - ping
                - '-p${DB_PASSWORD}'
            retries: 3
            timeout: 5s
    mysql_test:
        image: 'mysql/mysql-server:8.0'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ALLOW_EMPTY_PASSWORD: 'no'
        networks:
            - sail
networks:
    sail:
        driver: bridge
volumes:
    sail-mysql:
        driver: local
