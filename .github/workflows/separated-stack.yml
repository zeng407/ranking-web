name: Separated stack CI

on:
  push:
    branches: [master, develop]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - '.github/workflows/separated-stack.yml'
  pull_request:
    branches: [master, develop]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - '.github/workflows/separated-stack.yml'

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache-dependency-path: backend/go.sum
      - run: go test ./...
      - run: go vet ./...
