server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    absolute_redirect off;

    # Canonical locale URLs. Keep redirects at the HTTP layer so crawlers do
    # not have to execute the SPA before discovering the permanent move.
    location = /donate { return 301 /zh-tw/donate$is_args$args; }
    location = /tos { return 301 /zh-tw/tos$is_args$args; }
    location = /privacy { return 301 /zh-tw/privacy$is_args$args; }
    location = /zh-tw { return 301 /zh-tw/$is_args$args; }
    location = /en { return 301 /en/$is_args$args; }
    location = /ja { return 301 /ja/$is_args$args; }

    location ~ ^/lang/zh_TW(?:/(.*))?$ { return 301 /zh-tw/$1$is_args$args; }
    location ~ ^/lang/en(?:/(.*))?$ { return 301 /en/$1$is_args$args; }
    location ~ ^/lang/ja(?:/(.*))?$ { return 301 /ja/$1$is_args$args; }

    location = /app-config.js {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
    }

    # No proxy back to Laravel any more. /register, /logout, /login, /password and
    # /auth were all sent to host.docker.internal:80 while PHP owned the session
    # cookie, the CSRF token and the OAuth handshake; Go owns all of it now, under
    # /api/v1/auth, and those five paths are ordinary SPA routes served by the
    # try_files below.
    #
    # THE PROXIES COULD NOT STAY: this server listens on host port 80 itself, so
    # host.docker.internal:80 is now this same server, and every one of those
    # requests would have looped back into it.
    location / {
        add_header Cache-Control "public, max-age=0" always;
        try_files $uri $uri/ /index.html;
    }
}
